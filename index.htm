<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel de Futebol Ao Vivo</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #1e1e2f; color: white; text-align: center; margin: 0; padding: 20px; }
        h1 { color: #00d26a; }
        button { padding: 12px 25px; font-size: 16px; background-color: #00d26a; color: #1e1e2f; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-bottom: 20px; }
        button:hover { background-color: #00b359; }
        table { width: 100%; max-width: 800px; margin: 0 auto; border-collapse: collapse; background-color: #2a2a40; border-radius: 10px; overflow: hidden; }
        th, td { padding: 15px; border-bottom: 1px solid #444; }
        th { background-color: #3f3f5a; }
        .destaque { color: #00d26a; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Radar de Jogos Ao Vivo ⚽</h1>
    
    <button onclick="buscarEAnalisarJogos()">1. Iniciar Varredura Automática</button>
    <p id="status">Clique no botão para buscar os jogos e rodar a análise...</p>

    <table id="tabela" style="display: none;">
        <thead>
            <tr>
                <th>Tempo</th>
                <th>Partida</th>
                <th>Placar</th>
                <th>Status da Análise</th>
            </tr>
        </thead>
        <tbody id="lista-jogos">
        </tbody>
    </table>

    <script>
        const telegramToken = '8927164850:AAEnjdEz_ECUsAMjBrU02cbp25H9t_pl0Rk';
        const telegramChatId = '6196724270';
        const apiFootballKey = '00d6ac3905e17e3cb51b87bccc6ab13e';

        // Lista para não enviar o mesmo sinal duas vezes
        let jogosJaEnviados = [];

        async function buscarEAnalisarJogos() {
            const status = document.getElementById('status');
            const tabela = document.getElementById('tabela');
            const lista = document.getElementById('lista-jogos');
            
            status.innerText = 'Buscando e analisando oportunidades... ⏳';
            lista.innerHTML = ''; 

            try {
                const response = await fetch('https://v3.football.api-sports.io/fixtures?live=all', {
                    method: 'GET',
                    headers: { 'x-apisports-key': apiFootballKey }
                });
                
                const data = await response.json();
                const jogos = data.response;

                if (!jogos || jogos.length === 0) {
                    status.innerText = 'Nenhum jogo rolando no momento.';
                    return;
                }

                status.innerText = `Analisando ${jogos.length} jogos ao vivo...`;
                tabela.style.display = 'table';

                jogos.forEach(jogo => {
                    const idJogo = jogo.fixture.id;
                    const tempo = jogo.fixture.status.elapsed;
                    const casa = jogo.teams.home.name;
                    const visitante = jogo.teams.away.name;
                    const golsCasa = jogo.goals.home;
                    const golsVisitante = jogo.goals.away;
                    const totalGols = golsCasa + golsVisitante;
                    
                    let statusAnalise = "Aguardando momento ideal";
                    let dispararSinal = false;

                    // LÓGICA DE INTELIGÊNCIA:
                    // Procura jogos no segundo tempo (ex: entre 65 e 80 min) 
                    // Onde o jogo está empatado ou com 1 gol de diferença (cenário propício para Ambas Marcam ou +1 Gol)
                    if (tempo >= 65 && tempo <= 80) {
                        if (totalGols >= 1 && totalGols <= 3) {
                            statusAnalise = "🔥 Oportunidade Encontrada!";
                            dispararSinal = true;
                        }
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${tempo}'</td>
                        <td>${casa} x ${visitante}</td>
                        <td>${golsCasa} - ${golsVisitante}</td>
                        <td class="${dispararSinal ? 'destaque' : ''}">${statusAnalise}</td>
                    `;
                    lista.appendChild(tr);

                    // Se a inteligência aprovou e ainda não enviamos esse jogo hoje, envia o Telegram!
                    if (dispararSinal && !jogosJaEnviados.includes(idJogo)) {
                        enviarAlerta(casa, visitante, tempo, golsCasa, golsVisitante, totalGols);
                        jogosJaEnviados.push(idJogo); // Marca como enviado
                    }
                });

            } catch (error) {
                status.innerText = 'Erro na conexão com o servidor das estatísticas.';
            }
        }

        function enviarAlerta(casa, visitante, tempo, golsCasa, golsVisitante, totalGols) {
            const ambasMarcam = (golsCasa > 0 && golsVisitante > 0) ? "Sim" : "Ainda não";
            
            const mensagem = `🚨 *ALERTA DE GOLS / AMBAS MARCAM* 🚨\n\n⚽ *${casa} x ${visitante}*\n⏱️ *Tempo:* ${tempo} minutos\n🥅 *Placar:* ${golsCasa} - ${golsVisitante}\n\n📊 *Total de Gols Atual:* ${totalGols}\n🎯 *Ambas Marcam:* ${ambasMarcam}\n\n⚠️ _Cenário de alta pressão, fique de olho em escanteios e no próximo gol!_`;

            const url = `https://api.telegram.org/bot${telegramToken}/sendMessage`;

            fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ chat_id: telegramChatId, text: mensagem, parse_mode: 'Markdown' })
            });
        }
    </script>
</body>
</html>
